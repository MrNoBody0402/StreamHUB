{% extends 'catalog/base.html' %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 border-l-4 border-red-600 pl-3">My Watchlist ❤️</h1>
    
    <div id="watchlist-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-6">
        <!-- Dynamically rendered via JS -->
    </div>

    <div id="empty-msg" class="hidden text-center py-16">
        <p class="text-zinc-400 text-lg">Your watchlist is currently empty!</p>
        <a href="/" class="inline-block mt-4 px-6 py-2 bg-red-600 hover:bg-red-700 font-semibold rounded-lg transition">Explore Movies</a>
    </div>
</div>

<script>
    function renderWatchlist() {
        const list = JSON.parse(localStorage.getItem('streamhub_watchlist') || '[]');
        const container = document.getElementById('watchlist-grid');
        const emptyMsg = document.getElementById('empty-msg');

        if (list.length === 0) {
            emptyMsg.classList.remove('hidden');
            container.innerHTML = '';
            return;
        }

        emptyMsg.classList.add('hidden');
        container.innerHTML = list.map(item => `
            <div class="group relative transition transform hover:-translate-y-1 hover:scale-105 duration-300">
                <a href="/watch/${item.media_type}/${item.id}/">
                    <img src="https://image.tmdb.org/t/p/w500${item.poster}" class="rounded-xl shadow-lg border border-zinc-800 group-hover:border-red-600 group-hover:shadow-red-900/30">
                    <p class="mt-2 font-semibold text-sm truncate">${item.title}</p>
                </a>
                <button onclick="removeFromWatchlist('${item.id}')" class="absolute top-2 right-2 bg-black/70 hover:bg-red-600 p-1.5 rounded-full text-xs transition">
                    ❌
                </button>
            </div>
        `).join('');
    }

    function removeFromWatchlist(id) {
        let list = JSON.parse(localStorage.getItem('streamhub_watchlist') || '[]');
        list = list.filter(item => item.id.toString() !== id.toString());
        localStorage.setItem('streamhub_watchlist', JSON.stringify(list));
        renderWatchlist();
    }

    document.addEventListener('DOMContentLoaded', renderWatchlist);
</script>
{% endblock %}
