{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>

    <!-- Favicon Logo -->
    <link rel="icon" type="image/x-icon" href="{% static 'catalog/favicon.ico' %}">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .search-input-focus {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-input-focus:focus {
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.35);
            border-color: #e11d48;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin-fast {
            animation: spin 0.6s linear infinite;
        }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-zinc-950 to-black text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-rose-500 selection:text-white antialiased">
    
    <!-- Ambient Background Lighting Accent -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[350px] bg-rose-600/10 blur-[140px] pointer-events-none -z-10 rounded-full"></div>

    <!-- Glassmorphic Header Navigation -->
    <nav class="p-4 bg-zinc-950/70 backdrop-blur-xl border-b border-white/10 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-50 shadow-2xl">
        <div class="flex items-center gap-8">
            <a href="/" class="text-2xl font-black bg-gradient-to-r from-red-500 via-rose-500 to-amber-500 bg-clip-text text-transparent tracking-wider hover:opacity-90 transition transform active:scale-95">
                STREAMHUB
            </a>
            
            <!-- Genre Pills Navigation -->
            <div class="hidden lg:flex items-center gap-2 text-xs font-medium">
                <a href="/?genre=action" class="px-3.5 py-1.5 rounded-full bg-zinc-900/80 hover:bg-rose-600 border border-white/5 hover:border-rose-500/50 text-zinc-300 hover:text-white transition shadow-sm">Action</a>
                <a href="/?genre=comedy" class="px-3.5 py-1.5 rounded-full bg-zinc-900/80 hover:bg-rose-600 border border-white/5 hover:border-rose-500/50 text-zinc-300 hover:text-white transition shadow-sm">Comedy</a>
                <a href="/?genre=scifi" class="px-3.5 py-1.5 rounded-full bg-zinc-900/80 hover:bg-rose-600 border border-white/5 hover:border-rose-500/50 text-zinc-300 hover:text-white transition shadow-sm">Sci-Fi</a>
                <a href="/?genre=horror" class="px-3.5 py-1.5 rounded-full bg-zinc-900/80 hover:bg-rose-600 border border-white/5 hover:border-rose-500/50 text-zinc-300 hover:text-white transition shadow-sm">Horror</a>
                <a href="/?genre=animation" class="px-3.5 py-1.5 rounded-full bg-zinc-900/80 hover:bg-rose-600 border border-white/5 hover:border-rose-500/50 text-zinc-300 hover:text-white transition shadow-sm">Animation</a>
            </div>
        </div>

        <div class="flex items-center gap-4 w-full md:w-auto">
            <a href="{% url 'watchlist' %}" class="px-3.5 py-2 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 text-xs font-semibold transition border border-white/10 flex items-center gap-1.5 shadow-md">
                ❤️ <span class="hidden sm:inline">Watchlist</span>
            </a>

            <!-- Animated Search Form -->
            <form action="/" method="GET" id="search-form" onsubmit="handleSearchSubmit(event)" class="relative flex items-center gap-2 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <input 
                        type="text" 
                        name="q" 
                        id="search-input"
                        placeholder="Search movies & shows..." 
                        value="{{ query|default:'' }}"
                        class="search-input-focus bg-zinc-900/90 text-white pl-9 pr-8 py-2 rounded-xl border border-white/10 focus:outline-none w-full text-xs placeholder-zinc-500"
                    >
                    <div class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none">
                        <svg id="search-icon" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <svg id="search-spinner" class="w-4 h-4 text-rose-500 animate-spin-fast hidden" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </div>

                <button type="submit" id="search-btn" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition-all duration-200 active:scale-95 shadow-lg shadow-rose-600/25 flex items-center gap-1">
                    <span>Search</span>
                </button>
            </form>
        </div>
    </nav>
    
    <main class="container mx-auto px-4 py-8 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="p-6 bg-zinc-950/80 border-t border-white/5 text-center text-zinc-500 text-xs backdrop-blur-md">
        StreamHub catalog powered by TMDB API.
    </footer>

    <script>
        function handleSearchSubmit(e) {
            const input = document.getElementById('search-input');
            const searchIcon = document.getElementById('search-icon');
            const searchSpinner = document.getElementById('search-spinner');
            const searchBtn = document.getElementById('search-btn');

            if (input.value.trim() !== '') {
                searchIcon.classList.add('hidden');
                searchSpinner.classList.remove('hidden');
                searchBtn.classList.add('opacity-80');
            }
        }
    </script>
</body>
</html>
