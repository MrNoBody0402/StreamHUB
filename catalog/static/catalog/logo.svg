<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Core Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="75%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Hub Accent Gradient -->
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- White Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="iconGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Group Icon (Emblem at Left) -->
  <g transform="translate(24, 20)">
    <!-- App Icon Rounded Container -->
    <rect x="0" y="0" width="200" height="200" rx="48" fill="#121520" stroke="#222738" stroke-width="2.5"/>
    
    <!-- Ambient Inner Glow -->
    <circle cx="100" cy="100" r="70" fill="url(#brandGrad)" opacity="0.18" filter="blur(16px)"/>

    <!-- Concentric Streaming Arcs -->
    <path d="M 60 48 C 110 32, 160 52, 172 100 C 180 135, 160 170, 125 182" 
          fill="none" 
          stroke="url(#hubGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-dasharray="8 6" 
          opacity="0.7"/>

    <path d="M 40 85 C 32 110, 36 142, 60 166 C 82 188, 125 192, 150 180" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="9" 
          stroke-linecap="round" 
          opacity="0.85"/>

    <!-- Kinetic S Ribbon Stream -->
    <path d="M 85 65 C 130 55, 160 85, 150 115 C 142 140, 115 148, 92 155 C 68 162, 58 178, 72 188 C 88 198, 120 195, 140 178" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          filter="url(#iconGlow)"/>

    <!-- Play Wedge in Center -->
    <polygon points="90,75 145,108 90,141" 
             fill="url(#brandGrad)" 
             filter="url(#iconGlow)"/>
    <polygon points="94,82 138,108 94,134" 
             fill="#ffffff" 
             opacity="0.9"/>
  </g>

  <!-- Typography: STREAM -->
  <text x="260" y="145" 
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="88" 
        letter-spacing="5" 
        fill="url(#textGrad)">
    STREAM
  </text>

  <!-- Typography: HUB -->
  <text x="690" y="145" 
        font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="88" 
        letter-spacing="5" 
        fill="url(#hubGrad)">
    HUB
  </text>

  <!-- HD Tag Badge -->
  <g transform="translate(850, 68)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="42" height="24" rx="6" fill="#be123c" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="21" y="16.5" 
          font-family="'Outfit', system-ui, sans-serif" 
          font-weight="800" 
          font-size="11" 
          letter-spacing="1.5" 
          text-anchor="middle" 
          fill="#fb7185">
      HD
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="264" y="186" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-weight="600" 
        font-size="16" 
        letter-spacing="8" 
        fill="#94a3b8" 
        opacity="0.85">
    NEXT-GEN CINEMATIC STREAMING
  </text>
</svg>
